<!DOCTYPE html>
<html lang="en">

<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Izak</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
     <script src="script.js"></script>
</head>
<!-- This is the main body of the website- ALL your content goes AFTER the <body> tag and before the </body> tag -->
<body>
<a-scene>
  <a-assets>
 <img id="michealjackson" src="tvAssets/Lebron.jpg" preload="auto">
  <img id="frame1" src="tvAssets/.jpg" preload="auto">
     <!-- Video -->
<video id="videoclip" loop="true"src="tvAssets/videoplayback.mp4" crossorigin="anonymous" preload="auto"></video>
<!-- Buttons and Background -->
 <img id="play" src="tvAssets/btnPlay.png" preload="auto">
  <img id="pause" src="tvAssets/btnPause.png" preload="auto">
  <img id="tv_background" src="tvAssets/tv_background.jpg"preload="auto">
</a-assets>
<a-entity environment="preset: forest; dressingAmount: 700;"></a-entity>
<!-- Museum floor starts here -->
<a-cylinder id="floor" position="0 0 0" radius="7.5" color="green" height="0.1"></a-cylinder>
<a-box id="wall1" position="0 1.473 4.907" rotation="0 0 0" scale="10 3 0.2" color="red"></a-box>
<a-box id="wall2" position="0 1.473 -4.907" rotation="0 0 0" scale="10 3 0.2" color="red"></a-box>
 <a-box id="wall3" position="5.049 1.454 -0.008" rotation="0 -90 0 "scale="10 3 0.2" color="red"></a-box>
 <a-box id="wall3" position="-5.049 1.454 -0.008" rotation="0 -90 0 "scale="10 3 0.2" color="red"></a-box>
 <a-cylinder id="triangle_front" segments-radial="3" position="0 3.874 4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="blue"></a-cylinder>
<a-cylinder id="triangle_back" segments-radial="3" position="0 3.874 -4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="blue"></a-cylinder>
<a-box id="roof_right" position="2.580 4.328 0" rotation="28.433 90 0" scale="10.931 0.20 6.110" color="black"></a-box>
<a-box id="roof_left" position="-2.599 4.321 -0.017" rotation="28.433 -90 0" scale="10.931 0.20 6.130" color="black"></a-box>


<!-- TV with Play and Pause -->
<a-entity>
  <a-video src="#videoclip" position="-3.893 1.6 0" rotation="0 90 0" width="2" height="1.125"></a-video>

  <!-- TV background -->
  <a-plane id="videoControls" position="-3.893 0.854 0" scale="2 0.386 1.714" rotation="0 90 0" opacity="1" src="#tv_background">
    
    <!-- Play button -->
    <a-plane id="vidplaybox" src="#play" scale="0.122 0.678 0.122" position="-0.350 0 .01" shader="flat" transparent="true" videoplayer></a-plane>
    
    <!-- Stop button -->
    <a-plane id="vidpausebox" src="#pause" scale="0.122 0.678 0.122" position="0.350 0 .01" shader="flat" transparent="true" videopauser></a-plane>

  </a-plane>
</a-entity>


    <a-plane id="art1" src="#michealjackson" scale="2 2 0.05" rotation="0 0 0" position="-0.162 1.934 -4.792"></a-plane>


  <a-plane id="info_box1" position="1.076 1.144 -4.801" scale="0.6 1.5 0.01" width="0.8" height="0.25" color="black" transparent="true" opacity="1">
        <a-entity 
        position="0 0.004 6.864" 
        scale=".8 .6 1.273" 
        shader="flat"
        text="value: ; align: center; color: white; font: roboto; wrapCount:15;">
        </a-entity>
    </a-plane>

<!-- Allows clicking with the mouse -->
<a-entity cursor="rayOrigin: mouse"></a-entity>



</a-scene>
</body>
</html>
